name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  # Opt JavaScript actions into the Node 24 runtime, matching release.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  frontend:
    name: Frontend (${{ matrix.step }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        step: [lint, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: matrix.step == 'lint'
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        if: matrix.step == 'test'
        working-directory: frontend
        run: npm run test

      - name: Build (typecheck + bundle)
        if: matrix.step == 'build'
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend (${{ matrix.step }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        step: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        if: matrix.step == 'lint'
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy type check
        if: matrix.step == 'typecheck'
        working-directory: backend
        run: mypy src --ignore-missing-imports

      - name: Pytest
        if: matrix.step == 'test'
        working-directory: backend
        run: pytest

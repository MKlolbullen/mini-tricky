name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.4.0-beta)'
        required: true
        default: 'v0.4.0-beta'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PYTHON_PBS_DATE: '20241016'
  PYTHON_PBS_VERSION: '3.12.7'
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Catalog metadata used by scripts/sync_project_metadata.py.
# tools: <!-- tools-count -->148<!-- /tools-count -->
# templates: <!-- templates-count -->55<!-- /templates-count -->

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    concurrency:
      group: release-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            python_arch: aarch64-apple-darwin
            build_script: desktop:build:mac
          - os: windows-latest
            name: win
            python_arch: x86_64-pc-windows-msvc
            build_script: desktop:build:win
          - os: ubuntu-latest
            name: linux
            python_arch: x86_64-unknown-linux-gnu
            build_script: desktop:build:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Show runtime versions
        shell: bash
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "ref:  ${{ github.event.inputs.tag || github.ref_name }}"
          git log -1 --oneline || true

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm run frontend:install

      - name: Build frontend
        run: npm run frontend:build

      - name: Download bundled Python (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p backend/runtime
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_PBS_DATE}/cpython-${PYTHON_PBS_VERSION}+${PYTHON_PBS_DATE}-${{ matrix.python_arch }}-install_only.tar.gz"
          echo "Fetching $URL"
          curl -fsSL "$URL" -o /tmp/python.tar.gz
          tar -xzf /tmp/python.tar.gz -C backend/runtime
          rm /tmp/python.tar.gz
          backend/runtime/python/bin/python3 --version
          backend/runtime/python/bin/python3 -m pip install --no-cache-dir --upgrade pip
          backend/runtime/python/bin/python3 -m pip install --no-cache-dir -r backend/requirements.txt

      - name: Download bundled Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path backend/runtime | Out-Null
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/$env:PYTHON_PBS_DATE/cpython-$env:PYTHON_PBS_VERSION+$env:PYTHON_PBS_DATE-${{ matrix.python_arch }}-install_only.tar.gz"
          Write-Host "Fetching $url"
          Invoke-WebRequest -Uri $url -OutFile python.tar.gz
          tar -xzf python.tar.gz -C backend/runtime
          Remove-Item python.tar.gz
          backend/runtime/python/python.exe --version
          backend/runtime/python/python.exe -m pip install --no-cache-dir --upgrade pip
          backend/runtime/python/python.exe -m pip install --no-cache-dir -r backend/requirements.txt

      - name: Package desktop app
        run: npm run ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_LINK: ''
          CSC_LINK: ''

      - name: List build output
        shell: bash
        run: ls -lh dist-electron || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-dist
          if-no-files-found: error
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap
            dist-electron/latest*.yml

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-dist'
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: mini-tricky ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            ## mini-tricky ${{ github.event.inputs.tag || github.ref_name }}

            Local-first visual workflow automation for authorized offensive-security work.

            ### Highlights

            - Typed React Flow DAG editor with real CLI argument controls
            - <!-- tools-count -->148<!-- /tools-count --> integrated security tools
            - <!-- templates-count -->55<!-- /templates-count --> built-in workflow templates
            - Merge & Sort fan-in/deduplication and Payload Set source nodes
            - Live WebSocket execution, per-node artifacts, cancellation, and replay
            - Workflow versions, scheduling, modules, conditions, loops, and custom scripts
            - OS-keychain-backed profile secrets
            - Bundled Python runtime in desktop release artifacts
            - Build-provenance attestations generated by GitHub Actions

            ### External tools

            mini-tricky packages the orchestration application, not every security binary used by its catalog. Install the tools needed by your workflows on `PATH`, or use `scripts/install-tools.sh` / **Settings → Tool Manager**.

            ### Unsigned beta

            These desktop installers are not yet code-signed. macOS Gatekeeper and Windows SmartScreen may warn on first launch. Only install artifacts from this repository's Releases page and verify provenance where supported.

            ### Responsible use

            Use mini-tricky only on systems and targets you are authorized to assess.
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb

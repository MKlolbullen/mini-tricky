        type: string
      - flag: --top-ports
        label: Top Ports
        description: Scan N most common ports
        type: int

  - id: masscan
    name: Masscan
    category: Network
    description: Internet-scale port scanner at 10M packets per second
    inputs: [targets]
    outputs: [findings]
    command: [masscan, -iL, '{targets_file}', -p1-65535, --rate, '1000']
    output_mode: stdout
    timeout_seconds: 600
    args:
      - flag: --banners
        label: Banners
        description: Grab service banners from open ports
        type: flag
      - flag: --ping
        label: ICMP Ping
        description: Include ICMP ping in the scan
        type: flag
      - flag: --open-only
        label: Open Only
        description: Only output results for open ports
        type: flag
      - flag: --rate
        label: Rate
        description: Packets per second
        type: int
        default: '1000'
      - flag: -p
        label: Ports
        description: Port range to scan (e.g. 80,443 or 1-65535)
        type: string
        default: '1-65535'
      - flag: --exclude
        label: Exclude
        description: Exclude IP ranges (CIDR or file)
        type: string
      - flag: --wait
        label: Wait
        description: Seconds to wait for responses after transmit
        type: int
        default: '10'
      - flag: --source-port
        label: Source Port
        description: Use a specific source port
        type: int
      - flag: -oJ
        label: JSON Output
        description: Output results to a JSON file
        type: string

  - id: naabu
    name: Naabu
    category: Network
    description: Fast port scanner written in Go with SYN/CONNECT probe
    inputs: [targets]
    outputs: [targets]
    command: [naabu, -silent, -list, '{targets_file}']
    output_mode: stdout
    timeout_seconds: 600
    args:
      - flag: -Pn
        label: No Ping
        description: Skip host discovery
        type: flag
      - flag: -sn
        label: Ping Scan
        description: Ping scan only
        type: flag
      - flag: -sv
        label: Service Version
        description: Service version detection
        type: flag
      - flag: -c
        label: Concurrency
        description: Number of concurrent threads
        type: int
        default: '25'
      - flag: -rate
        label: Rate
        description: Packets per second
        type: int
        default: '1000'
      - flag: -p
        label: Ports
        description: Ports to scan
        type: string
      - flag: -top-ports
        label: Top Ports
        description: Top ports to scan
        type: string
        default: '100'

  - id: rustscan
    name: RustScan
    category: Network
    description: Extremely fast port scanner built in Rust
    inputs: [targets]
    outputs: [findings]
    command: [rustscan, -a, '{targets}', --ulimit, '5000']
    output_mode: stdout
    timeout_seconds: 600
    args:
      - flag: --greppable
        label: Greppable
        description: Greppable output
        type: flag
      - flag: --accessible
        label: Accessible
        description: Accessible mode
        type: flag
      - flag: --ulimit
        label: Ulimit
        description: File descriptor limit
        type: int
        default: '5000'
      - flag: -b
        label: Batch Size
        description: Batch size for port scanning
        type: int
        default: '4500'
      - flag: -t
        label: Timeout
        description: Connection timeout in ms
        type: int
        default: '1500'
      - flag: -p
        label: Ports
        description: Ports to scan
        type: string


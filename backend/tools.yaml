        label: Port
        description: Port to use in command substitutions
        type: string
      - flag: -silent
        label: Silent
        description: Don't display banner
        type: flag
      - flag: -v
        label: Verbose
        description: Enable verbose output
        type: flag

  - id: rush
    name: Rush
    category: Utility

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .font-ui { font-family: Inter, system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; }
      .text-primary { fill: #d6e2ff; }
      .text-muted { fill: #8fa5d2; }
      .text-cyan { fill: rgba(91, 220, 255, 0.85); }
    </style>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1829"/>
      <stop offset="100%" stop-color="#0c1423"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#09111f"/>

  <!-- Panel -->
  <rect x="40" y="20" width="720" height="560" rx="16" fill="url(#panelGrad)" stroke="rgba(91,220,255,0.2)" stroke-width="1" filter="url(#softShadow)"/>

  <!-- Node Header -->
  <rect x="40" y="20" width="720" height="88" rx="16" fill="#0c1423"/>
  <rect x="40" y="92" width="720" height="16" fill="#0c1423"/>
  <line x1="40" y1="108" x2="760" y2="108" stroke="rgba(91,220,255,0.12)" stroke-width="1"/>

  <!-- Icon -->
  <circle cx="96" cy="64" r="24" fill="rgba(91,140,255,0.12)" stroke="rgba(91,140,255,0.3)" stroke-width="1.5"/>
  <!-- Magnifying glass icon -->
  <circle cx="92" cy="60" r="9" fill="none" stroke="#5b8cff" stroke-width="2"/>
  <line x1="99" y1="67" x2="105" y2="73" stroke="#5b8cff" stroke-width="2" stroke-linecap="round"/>

  <!-- Name and kind -->
  <text x="132" y="56" class="font-ui text-primary" font-size="20" font-weight="700">Subfinder</text>
  <text x="132" y="78" class="font-ui text-muted" font-size="13">Recon Tool</text>

  <!-- Run state badge -->
  <rect x="620" y="42" width="100" height="30" rx="15" fill="rgba(67,217,173,0.1)" stroke="rgba(67,217,173,0.35)" stroke-width="1"/>
  <circle cx="641" cy="57" r="4" fill="#43d9ad"/>
  <text x="654" y="62" class="font-ui" fill="#43d9ad" font-size="12" font-weight="600">success</text>

  <!-- Close button -->
  <g transform="translate(738, 40)" cursor="pointer">
    <circle r="14" fill="rgba(91,220,255,0.06)" stroke="rgba(91,220,255,0.15)" stroke-width="1"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#8fa5d2" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#8fa5d2" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Tabs -->
  <g transform="translate(40, 116)">
    <rect width="720" height="44" fill="#0c1423"/>
    <rect x="0" y="44" width="720" height="1" fill="rgba(91,220,255,0.1)"/>
    <!-- Active tab -->
    <rect x="20" y="8" width="110" height="30" rx="8" fill="rgba(91,220,255,0.1)" stroke="rgba(91,220,255,0.3)" stroke-width="1"/>
    <text x="75" y="28" class="font-ui text-cyan" font-size="13" font-weight="600" text-anchor="middle">Arguments</text>
    <!-- Inactive tabs -->
    <text x="180" y="28" class="font-ui text-muted" font-size="13" font-weight="500">Output</text>
    <text x="260" y="28" class="font-ui text-muted" font-size="13" font-weight="500">History</text>
  </g>

  <!-- Scrollable content area -->
  <g transform="translate(60, 180)">

    <!-- INPUT section -->
    <text x="0" y="0" class="font-ui text-muted" font-size="11" font-weight="700" letter-spacing="1.2">INPUTS</text>
    <rect x="0" y="14" width="680" height="70" rx="10" fill="#101b2d" stroke="rgba(91,220,255,0.12)" stroke-width="1"/>
    <!-- Connected dot (green = connected) -->
    <circle cx="18" cy="42" r="7" fill="rgba(67,217,173,0.15)" stroke="rgba(67,217,173,0.5)" stroke-width="1.5"/>
    <circle cx="18" cy="42" r="3.5" fill="#43d9ad"/>
    <text x="34" y="40" class="font-ui text-primary" font-size="14" font-weight="600">domain</text>
    <rect x="100" y="30" width="50" height="20" rx="4" fill="rgba(91,140,255,0.1)"/>
    <text x="125" y="44" class="font-ui" fill="#5b8cff" font-size="10" font-weight="500" text-anchor="middle">string</text>
    <text x="34" y="68" class="font-ui text-muted" font-size="11">Connected from: <tspan fill="#43d9ad">variable-1</tspan> ($target_domain)</text>
    <!-- Connection line indicator -->
    <rect x="590" y="32" width="76" height="24" rx="6" fill="rgba(67,217,173,0.08)" stroke="rgba(67,217,173,0.25)" stroke-width="1"/>
    <text x="628" y="49" class="font-ui" fill="#43d9ad" font-size="10" font-weight="500" text-anchor="middle">Connected</text>

    <!-- OUTPUT section -->
    <text x="0" y="108" class="font-ui text-muted" font-size="11" font-weight="700" letter-spacing="1.2">OUTPUTS</text>
    <rect x="0" y="122" width="680" height="70" rx="10" fill="#101b2d" stroke="rgba(91,220,255,0.12)" stroke-width="1"/>
    <circle cx="662" cy="150" r="7" fill="rgba(91,220,255,0.15)" stroke="rgba(91,220,255,0.5)" stroke-width="1.5"/>
    <circle cx="662" cy="150" r="3.5" fill="#5bdcff"/>
    <text x="18" y="148" class="font-ui text-primary" font-size="14" font-weight="600">targets</text>
    <rect x="78" y="138" width="36" height="20" rx="4" fill="rgba(67,217,173,0.1)"/>
    <text x="96" y="152" class="font-ui" fill="#43d9ad" font-size="10" font-weight="500" text-anchor="middle">file</text>
    <text x="18" y="176" class="font-ui text-muted" font-size="11">Connected to: <tspan fill="#5bdcff">tool-2</tspan> (httpx-1.input)</text>
    <rect x="590" y="140" width="60" height="24" rx="6" fill="rgba(91,220,255,0.08)" stroke="rgba(91,220,255,0.25)" stroke-width="1"/>
    <text x="620" y="157" class="font-ui text-cyan" font-size="10" font-weight="500" text-anchor="middle">1 link</text>

    <!-- TOOL CONFIGURATION section -->
    <text x="0" y="220" class="font-ui text-muted" font-size="11" font-weight="700" letter-spacing="1.2">TOOL CONFIGURATION</text>
    <rect x="0" y="234" width="680" height="72" rx="10" fill="#09111f" stroke="rgba(91,220,255,0.1)" stroke-width="1"/>
    <!-- Code block styling -->
    <text x="8" y="250" class="font-ui text-muted" font-size="9" font-weight="500">Command Template</text>
    <text x="18" y="270" class="font-mono" fill="#43d9ad" font-size="12">subfinder -d <tspan fill="rgba(91,220,255,0.85)">{{input.domain}}</tspan> -silent</text>
    <text x="18" y="292" class="font-mono" fill="#43d9ad" font-size="12">  -o <tspan fill="rgba(91,220,255,0.85)">{{output.targets}}</tspan> -t <tspan fill="rgba(91,220,255,0.85)">{{params.threads}}</tspan></text>

    <!-- PARAMETERS section -->
    <text x="0" y="332" class="font-ui text-muted" font-size="11" font-weight="700" letter-spacing="1.2">PARAMETERS</text>
    <rect x="0" y="346" width="680" height="52" rx="10" fill="#101b2d" stroke="rgba(91,220,255,0.12)" stroke-width="1"/>
    <!-- Key -->
    <rect x="14" y="356" width="120" height="32" rx="6" fill="#09111f" stroke="rgba(91,220,255,0.15)" stroke-width="1"/>
    <text x="28" y="377" class="font-mono text-primary" font-size="12">threads</text>
    <!-- Separator -->
    <text x="148" y="377" class="font-ui text-muted" font-size="14">=</text>
    <!-- Value -->
    <rect x="168" y="356" width="100" height="32" rx="6" fill="#09111f" stroke="rgba(91,220,255,0.15)" stroke-width="1"/>
    <text x="182" y="377" class="font-mono text-primary" font-size="12">50</text>
    <!-- Delete button -->
    <g transform="translate(644, 372)">
      <circle r="10" fill="rgba(255,91,108,0.08)" stroke="rgba(255,91,108,0.2)" stroke-width="1"/>
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#ff5b6c" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Add Parameter button (dashed) -->
    <rect x="0" y="410" width="680" height="40" rx="10" fill="none" stroke="rgba(91,220,255,0.18)" stroke-width="1.5" stroke-dasharray="8,5"/>
    <text x="340" y="435" class="font-ui text-muted" font-size="13" text-anchor="middle">+ Add Parameter</text>

    <!-- PRESETS section -->
    <text x="0" y="476" class="font-ui text-muted" font-size="11" font-weight="700" letter-spacing="1.2">PRESETS</text>
    <rect x="0" y="490" width="160" height="32" rx="8" fill="rgba(91,140,255,0.08)" stroke="rgba(91,140,255,0.25)" stroke-width="1"/>
    <text x="80" y="511" class="font-ui" fill="#5b8cff" font-size="12" font-weight="500" text-anchor="middle">Fast Scan</text>
    <rect x="172" y="490" width="160" height="32" rx="8" fill="rgba(91,140,255,0.08)" stroke="rgba(91,140,255,0.25)" stroke-width="1"/>
    <text x="252" y="511" class="font-ui" fill="#5b8cff" font-size="12" font-weight="500" text-anchor="middle">Deep Scan</text>
    <rect x="344" y="490" width="160" height="32" rx="8" fill="rgba(91,140,255,0.08)" stroke="rgba(91,140,255,0.25)" stroke-width="1"/>
    <text x="424" y="511" class="font-ui" fill="#5b8cff" font-size="12" font-weight="500" text-anchor="middle">Custom</text>
  </g>
</svg>
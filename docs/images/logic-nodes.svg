<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="canvasBg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0f1a2f"/>
      <stop offset="100%" stop-color="#09111f"/>
    </linearGradient>
    <linearGradient id="nodeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11203a"/>
      <stop offset="100%" stop-color="#0c1628"/>
    </linearGradient>
    <linearGradient id="condBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1423"/>
      <stop offset="100%" stop-color="#1f1a10"/>
    </linearGradient>
    <linearGradient id="loopBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1423"/>
      <stop offset="100%" stop-color="#1f1c10"/>
    </linearGradient>
    <linearGradient id="modBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1423"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5bdcff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43d9ad"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5b6c"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .node-name { fill: #e7f0ff; font-size: 13px; font-weight: 600; }
    .node-kind { fill: #95acd8; font-size: 10px; letter-spacing: 0.8px; }
    .socket-label { fill: #bfd0f5; font-size: 11px; }
    .state-pill { font-size: 10px; fill: #9fb2d9; letter-spacing: 0.5px; }
    .icon { font-size: 16px; }
  </style>

  <!-- Canvas background -->
  <rect width="1000" height="500" fill="url(#canvasBg)" rx="12"/>

  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.8" fill="rgba(91,220,255,0.08)"/>
  </pattern>
  <rect width="1000" height="500" fill="url(#dots)" rx="12"/>

  <!-- Node: Domain Input (variable) -->
  <rect x="30" y="180" width="160" height="90" rx="16" fill="url(#nodeBg)" stroke="rgba(103,224,157,0.55)" stroke-width="1"/>
  <rect x="30" y="180" width="3" height="90" rx="1.5" fill="#43d9ad"/>
  <text x="50" y="210" class="icon">📥</text>
  <text x="68" y="210" class="node-name">Domain Input</text>
  <text x="50" y="228" class="node-kind">VARIABLE</text>
  <!-- Output socket -->
  <circle cx="190" cy="250" r="6" fill="#63e6ff" stroke="#0b1220" stroke-width="2"/>
  <text x="152" y="253" class="socket-label">domain</text>

  <!-- Edge: Input -> Condition -->
  <path d="M 196 250 C 240 250 240 220 280 220" fill="none" stroke="#5bdcff88" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)"/>

  <!-- Node: Condition -->
  <rect x="280" y="150" width="180" height="120" rx="16" fill="url(#condBg)" stroke="rgba(255,159,67,0.55)" stroke-width="1"/>
  <rect x="280" y="150" width="3" height="120" rx="1.5" fill="#ff9f43"/>
  <text x="300" y="180" class="icon">⚖️</text>
  <text x="320" y="180" class="node-name">Condition</text>
  <text x="300" y="198" class="node-kind">CONDITIONAL BRANCH</text>
  <text x="300" y="218" fill="#8fa5d2" font-size="11" font-family="Inter, system-ui">expr: has_lines</text>
  <!-- Input socket -->
  <circle cx="280" cy="220" r="6" fill="#63e6ff" stroke="#0b1220" stroke-width="2"/>
  <!-- Pass output socket -->
  <circle cx="460" cy="195" r="6" fill="#43d9ad" stroke="#0b1220" stroke-width="2"/>
  <text x="430" y="185" class="socket-label" fill="#43d9ad">pass</text>
  <!-- Fail output socket -->
  <circle cx="460" cy="245" r="6" fill="#ff5b6c" stroke="#0b1220" stroke-width="2"/>
  <text x="435" y="261" class="socket-label" fill="#ff5b6c">fail</text>

  <!-- Edge: Condition pass -> Loop -->
  <path d="M 466 195 C 510 195 510 180 540 180" fill="none" stroke="#43d9ad88" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrowGreen)"/>

  <!-- Edge: Condition fail -> Fail Output -->
  <path d="M 466 245 C 520 245 520 400 560 400" fill="none" stroke="#ff5b6c88" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrowRed)"/>

  <!-- Node: Loop/Iterator -->
  <rect x="540" y="120" width="170" height="110" rx="16" fill="url(#loopBg)" stroke="rgba(255,207,91,0.55)" stroke-width="1"/>
  <rect x="540" y="120" width="3" height="110" rx="1.5" fill="#ffcf5b"/>
  <text x="560" y="150" class="icon">🔄</text>
  <text x="580" y="150" class="node-name">Iterator</text>
  <text x="560" y="168" class="node-kind">LOOP (PER LINE)</text>
  <!-- Input socket -->
  <circle cx="540" cy="180" r="6" fill="#63e6ff" stroke="#0b1220" stroke-width="2"/>
  <!-- Output socket -->
  <circle cx="710" cy="180" r="6" fill="#63e6ff" stroke="#0b1220" stroke-width="2"/>
  <text x="682" y="207" class="socket-label">item</text>

  <!-- Edge: Loop -> Nuclei -->
  <path d="M 716 180 C 750 180 750 195 775 195" fill="none" stroke="#5bdcff88" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)"/>

  <!-- Node: Nuclei (tool) -->
  <rect x="775" y="140" width="170" height="110" rx="16" fill="url(#nodeBg)" stroke="rgba(91,220,255,0.55)" stroke-width="1"/>
  <rect x="775" y="140" width="3" height="110" rx="1.5" fill="#ff5b6c"/>
  <text x="795" y="170" class="icon">🛡️</text>
  <text x="815" y="170" class="node-name">Nuclei</text>
  <text x="795" y="188" class="node-kind">VULNERABILITY</text>
  <!-- Success state pill -->
  <rect x="795" y="198" width="68" height="20" rx="10" fill="#14381f" stroke="rgba(103,224,157,0.3)" stroke-width="1"/>
  <text x="809" y="212" class="state-pill" fill="#79f2a3">SUCCESS</text>
  <!-- Input socket -->
  <circle cx="775" cy="195" r="6" fill="#63e6ff" stroke="#0b1220" stroke-width="2"/>
  <text x="783" y="232" class="socket-label">targets</text>
  <!-- Output socket -->
  <circle cx="945" cy="195" r="6" fill="#63e6ff" stroke="#0b1220" stroke-width="2"/>
  <text x="902" y="232" class="socket-label">findings</text>

  <!-- Node: Fail Output -->
  <rect x="560" y="365" width="160" height="80" rx="16" fill="url(#nodeBg)" stroke="rgba(255,215,110,0.55)" stroke-width="1"/>
  <rect x="560" y="365" width="3" height="80" rx="1.5" fill="#ff9f43"/>
  <text x="580" y="393" class="icon">📤</text>
  <text x="600" y="393" class="node-name">No Results</text>
  <text x="580" y="411" class="node-kind">OUTPUT</text>
  <!-- Input socket -->
  <circle cx="560" cy="400" r="6" fill="#63e6ff" stroke="#0b1220" stroke-width="2"/>

  <!-- Legend -->
  <rect x="30" y="420" width="250" height="60" rx="12" fill="rgba(12,20,35,0.8)" stroke="rgba(91,220,255,0.15)" stroke-width="1"/>
  <circle cx="52" cy="440" r="5" fill="#ff9f43"/>
  <text x="62" y="444" class="socket-label">Condition (if/else)</text>
  <circle cx="52" cy="460" r="5" fill="#ffcf5b"/>
  <text x="62" y="464" class="socket-label">Iterator (loop)</text>
  <circle cx="172" cy="440" r="5" fill="#b47cff"/>
  <text x="182" y="444" class="socket-label">Module</text>
  <circle cx="172" cy="460" r="5" fill="#ff5b6c"/>
  <text x="182" y="464" class="socket-label">Vulnerability</text>
</svg>
